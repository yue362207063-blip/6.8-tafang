<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡通塔防</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  overflow: hidden;
  user-select: none;
}
#gameContainer {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}
canvas { display: block; }
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  z-index: 10;
  pointer-events: none;
}
.hud-item {
  display: flex;
  align-items: center;
  gap: 6px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  pointer-events: auto;
  cursor: pointer;
}
.hud-icon { font-size: 20px; }
#towerBar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 90px;
  background: linear-gradient(0deg, rgba(30,30,60,0.97) 0%, rgba(30,30,60,0.85) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 0 16px;
  z-index: 10;
  border-top: 2px solid rgba(255,255,255,0.1);
}
.tower-btn {
  width: 70px;
  height: 74px;
  border-radius: 12px;
  border: 3px solid transparent;
  background: rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  color: #fff;
  font-size: 11px;
  gap: 1px;
}
.tower-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-3px); }
.tower-btn.selected { border-color: #FFD700; background: rgba(255,215,0,0.18); box-shadow: 0 0 18px rgba(255,215,0,0.35); }
.tower-btn .icon { font-size: 26px; }
.tower-btn .name { font-weight: 600; font-size: 11px; }
.tower-btn .cost { color: #FFD700; font-weight: 700; font-size: 11px; }
#startBtn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  padding: 18px 48px;
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  z-index: 20;
  box-shadow: 0 8px 32px rgba(102,126,234,0.5);
  transition: all 0.2s;
}
#startBtn:hover { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 12px 40px rgba(102,126,234,0.7); }
#gameOver {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.78);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 30;
  gap: 22px;
}
#gameOver.show { display: flex; }
#gameOver h1 { color: #fff; font-size: 44px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
#gameOver button {
  padding: 14px 44px;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #f093fb, #f5576c);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.15s;
}
#gameOver button:hover { transform: scale(1.05); }
.wave-announce {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #FFD700;
  font-size: 48px;
  font-weight: 900;
  text-shadow: 0 0 25px rgba(255,215,0,0.9), 0 4px 10px rgba(0,0,0,0.5);
  z-index: 15;
  pointer-events: none;
  animation: waveIn 1.8s ease-out forwards;
}
@keyframes waveIn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); }
  25% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
}
.boss-warning {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #FF4444;
  font-size: 52px;
  font-weight: 900;
  text-shadow: 0 0 35px rgba(255,0,0,0.9), 0 4px 10px rgba(0,0,0,0.5);
  z-index: 16;
  pointer-events: none;
  animation: bossWarn 2.2s ease-out forwards;
}
@keyframes bossWarn {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(3) rotate(-5deg); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(0deg); }
  30% { transform: translate(-50%, -50%) scale(0.98); }
  60% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hud-item"><span class="hud-icon">🌊</span><span>波次: <span id="hudWave">0/10</span></span></div>
    <div class="hud-item"><span class="hud-icon">❤️</span><span>血量: <span id="hudHP">10</span></span></div>
    <div class="hud-item"><span class="hud-icon">💰</span><span>金币: <span id="hudGold">200</span></span></div>
    <div class="hud-item"><span id="hudStatus" style="color:#aaffaa;font-size:13px;">点击HUD开始下一波</span></div>
  </div>
  <div id="towerBar"></div>
  <button id="startBtn">开始游戏 🎮</button>
  <div id="gameOver"><h1 id="goTitle">游戏结束</h1><button onclick="location.reload()">再来一局 🔄</button></div>
</div>

<script>
// ========== AUDIO SYSTEM ==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBuildSound() {
  ensureAudio();
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle';
    o.frequency.setValueAtTime(400, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.12);
    o.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.28);
    o.start(); o.stop(audioCtx.currentTime + 0.28);
  } catch(e) {}
}

function playArrowSound() {
  ensureAudio();
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(1400, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.07);
    g.gain.setValueAtTime(0.13, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
    o.start(); o.stop(audioCtx.currentTime + 0.09);
  } catch(e) {}
}

function playCannonSound() {
  ensureAudio();
  try {
    const bufSize = Math.floor(audioCtx.sampleRate * 0.35);
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 2.5);
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    src.buffer = buf;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    f.type = 'lowpass'; f.frequency.value = 700;
    g.gain.setValueAtTime(0.35, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    src.start(); src.stop(audioCtx.currentTime + 0.35);
  } catch(e) {}
}

function playIceSound() {
  ensureAudio();
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(2200, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.18);
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
    o.start(); o.stop(audioCtx.currentTime + 0.22);
  } catch(e) {}
}

function playDeathSound() {
  ensureAudio();
  try {
    const bufSize = Math.floor(audioCtx.sampleRate * 0.35);
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 2);
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain();
    const f = audioCtx.createBiquadFilter();
    src.buffer = buf;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    f.type = 'lowpass'; f.frequency.value = 1000;
    g.gain.setValueAtTime(0.4, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    src.start(); src.stop(audioCtx.currentTime + 0.35);
  } catch(e) {}
}

function playBossSound() {
  ensureAudio();
  try {
    [0, 0.18, 0.36].forEach((t, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime([180, 120, 80][i], audioCtx.currentTime + t);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + t + 0.28);
      o.start(audioCtx.currentTime + t);
      o.stop(audioCtx.currentTime + t + 0.28);
    });
  } catch(e) {}
}

function playSellSound() {
  ensureAudio();
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(900, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.18);
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
    o.start(); o.stop(audioCtx.currentTime + 0.22);
  } catch(e) {}
}

// ========== CONSTANTS ==========
const TILE = 48;
const COLS = 20;
const ROWS = 13;
const W = COLS * TILE;
const H = ROWS * TILE;

const TOWER_TYPES = {
  arrow: {
    name: '箭塔', icon: '🏹', cost: 80, color: '#4CAF50',
    range: 140, damage: 18, fireRate: 0.75, projSpeed: 9,
    desc: '单体攻击', upgradeCost: 60
  },
  cannon: {
    name: '炮塔', icon: '💣', cost: 160, color: '#F44336',
    range: 115, damage: 50, fireRate: 2.0, projSpeed: 5, aoe: 58,
    desc: '范围爆炸', upgradeCost: 110
  },
  ice: {
    name: '冰塔', icon: '❄️', cost: 100, color: '#2196F3',
    range: 130, damage: 8, fireRate: 1.0, projSpeed: 7,
    slow: 0.35, slowDuration: 2.2,
    desc: '减速敌人', upgradeCost: 70
  }
};

// ========== GAME STATE ==========
let canvas, ctx;
let gameState = 'menu';
let gold = 200, hp = 10, wave = 0, maxWaves = 10;
let towers = [], enemies = [], projectiles = [], particles = [];
let pathTiles = [];
let selectedTowerType = null;
let hoveredTile = null;
let spawnTimer = 0, spawnCount = 0, spawnTotal = 0;
let selectedTower = null;

// ========== PATH GENERATION ==========
// Path is an array of {col, row} tile coordinates
function generatePath() {
  // Hand-crafted path: starts left side, winds through, ends right side
  // Using tile coordinates (0..COLS-1, 0..ROWS-1)
  pathTiles = [
    {c:0, r:6}, {c:1, r:6}, {c:2, r:6}, {c:3, r:5}, {c:4, r:4},
    {c:5, r:4}, {c:6, r:4}, {c:7, r:5}, {c:8, r:6}, {c:9, r:7},
    {c:10, r:7}, {c:11, r:7}, {c:12, r:6}, {c:13, r:5}, {c:14, r:5},
    {c:15, r:6}, {c:16, r:7}, {c:17, r:7}, {c:18, r:7}, {c:19, r:7}
  ];
}

function getPathPixel(dist) {
  // dist is in tile-units along path (can be fractional)
  const idx = Math.floor(dist);
  if (idx < 0) return { x: pathTiles[0].c * TILE + TILE/2, y: pathTiles[0].r * TILE + TILE/2 };
  if (idx >= pathTiles.length - 1) return { x: pathTiles[pathTiles.length-1].c * TILE + TILE/2, y: pathTiles[pathTiles.length-1].r * TILE + TILE/2 };
  const frac = dist - idx;
  const p0 = pathTiles[idx], p1 = pathTiles[idx+1];
  return {
    x: (p0.c + (p1.c - p0.c) * frac) * TILE + TILE/2,
    y: (p0.r + (p1.r - p0.r) * frac) * TILE + TILE/2
  };
}

function getPathLength() { return pathTiles.length; }

function isOnPath(px, py, margin) {
  margin = margin || TILE * 0.55;
  for (let i = 0; i < pathTiles.length; i++) {
    const cx = pathTiles[i].c * TILE + TILE/2;
    const cy = pathTiles[i].r * TILE + TILE/2;
    if (Math.abs(px - cx) < margin && Math.abs(py - cy) < margin) return true;
  }
  return false;
}

// ========== TOWER CLASS ==========
class Tower {
  constructor(type, col, row) {
    const t = TOWER_TYPES[type];
    this.type = type;
    this.col = col;
    this.row = row;
    this.x = col * TILE + TILE / 2;
    this.y = row * TILE + TILE / 2;
    this.level = 1;
    this.range = t.range;
    this.damage = t.damage;
    this.fireRate = t.fireRate;
    this.fireCooldown = 0;
    this.angle = 0;
    this.totalInvested = t.cost;
  }
  getSellValue() { return Math.floor(this.totalInvested * 0.6); }
  getUpgradeCost() {
    const t = TOWER_TYPES[this.type];
    return t.upgradeCost + (this.level - 1) * 25;
  }
  canUpgrade() { return this.level < 5; }
  upgrade() {
    const t = TOWER_TYPES[this.type];
    if (this.level >= 5) return false;
    const cost = this.getUpgradeCost();
    if (gold < cost) return false;
    gold -= cost;
    this.totalInvested += cost;
    this.level++;
    this.damage = Math.floor(t.damage * (1 + (this.level - 1) * 0.38));
    this.range = t.range + (this.level - 1) * 14;
    this.fireRate = Math.max(0.2, t.fireRate - (this.level - 1) * 0.12);
    return true;
  }
  update(dt) {
    this.fireCooldown -= dt;
    if (this.fireCooldown > 0) return;
    let target = null, minDist = Infinity;
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      const d = Math.hypot(e.x - this.x, e.y - this.y);
      if (d <= this.range && e.distAlongPath >= 0 && d < minDist) {
        minDist = d;
        target = e;
      }
    }
    if (!target) return;
    this.angle = Math.atan2(target.y - this.y, target.x - this.x);
    this.fireCooldown = this.fireRate;
    const t = TOWER_TYPES[this.type];
    projectiles.push({
      x: this.x, y: this.y,
      tx: target.x, ty: target.y,
      target: target,
      speed: t.projSpeed,
      damage: this.damage,
      type: this.type,
      aoe: t.aoe || 0,
      slow: t.slow || 0,
      slowDuration: t.slowDuration || 0,
      trail: []
    });
    if (this.type === 'arrow') playArrowSound();
    else if (this.type === 'cannon') playCannonSound();
    else playIceSound();
  }
  draw() {
    const t = TOWER_TYPES[this.type];
    const cx = this.x, cy = this.y;
    const r = 16 + this.level * 2.5;
    // Range circle when selected
    if (selectedTower && selectedTower === this) {
      ctx.beginPath();
      ctx.arc(cx, cy, this.range, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    // Base circle
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, r);
    grad.addColorStop(0, lightenColor(t.color, 50));
    grad.addColorStop(1, t.color);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Barrel
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(this.angle);
    ctx.fillStyle = darkenColor(t.color, 40);
    if (this.type === 'cannon') {
      ctx.fillRect(10, -5, 18, 10);
      ctx.beginPath();
      ctx.arc(10, 0, 6, -Math.PI/2, Math.PI/2);
      ctx.fill();
    } else {
      ctx.fillRect(9, -3, 15, 6);
    }
    ctx.restore();
    // Emoji icon
    ctx.font = `${13 + this.level}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.icon, cx, cy);
    // Level stars
    for (let i = 0; i < this.level; i++) {
      ctx.fillStyle = '#FFD700';
      ctx.font = '7px serif';
      ctx.fillText('★', cx - 7 + i * 8, cy - r - 3);
    }
  }
}

// ========== ENEMY ==========
function spawnEnemy(waveNum, isBoss) {
  isBoss = !!isBoss;
  const baseHP = isBoss ? 350 + waveNum * 180 : 28 + waveNum * 20;
  const baseSpeed = isBoss ? 0.35 : 0.7 + waveNum * 0.07;
  const goldVal = isBoss ? 60 + waveNum * 12 : 5 + Math.floor(waveNum * 1.8);
  const size = isBoss ? 20 : 7 + Math.min(waveNum, 6);
  enemies.push({
    x: pathTiles[0].c * TILE + TILE/2,
    y: pathTiles[0].r * TILE + TILE/2,
    distAlongPath: 0,
    hp: baseHP, maxHp: baseHP,
    speed: baseSpeed + Math.random() * 0.15,
    baseSpeed: baseSpeed,
    gold: goldVal,
    size: size,
    isBoss: isBoss,
    slowTimer: 0,
    color: isBoss ? '#EE2222' : hslToHex(Math.floor(Math.random()*360), 68, 58),
    wobble: Math.random() * Math.PI * 2
  });
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.slowTimer > 0) {
      e.slowTimer -= dt;
      e.distAlongPath += e.baseSpeed * 0.35 * dt * 60;
    } else {
      e.distAlongPath += e.speed * dt * 60;
    }
    const pos = getPathPixel(e.distAlongPath);
    e.x = pos.x + Math.sin(e.wobble + Date.now()*0.003) * 1.5;
    e.y = pos.y + Math.cos(e.wobble + Date.now()*0.004) * 1.5;
    // Reached end
    if (e.distAlongPath >= pathTiles.length - 1.5) {
      hp--;
      spawnParticles(e.x, e.y, '#FF2222', 10);
      enemies.splice(i, 1);
      updateHUD();
      if (hp <= 0) { gameOver(false); }
      continue;
    }
    if (e.hp <= 0) {
      gold += e.gold;
      spawnParticles(e.x, e.y, e.isBoss ? '#FF6600' : '#FFD700', e.isBoss ? 22 : 8);
      playDeathSound();
      enemies.splice(i, 1);
      updateHUD();
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    const sx = e.x, sy = e.y;
    // Shadow
    ctx.beginPath();
    ctx.ellipse(sx, sy + e.size * 0.65, e.size * 0.65, e.size * 0.22, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fill();
    // Body
    ctx.beginPath();
    ctx.arc(sx, sy, e.size, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(sx - e.size*0.25, sy - e.size*0.25, 1, sx, sy, e.size);
    grad.addColorStop(0, lightenColor(e.color, 55));
    grad.addColorStop(1, e.color);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = darkenColor(e.color, 35);
    ctx.lineWidth = 2;
    ctx.stroke();
    // Eyes
    const blink = Math.sin(Date.now() * 0.005) > 0.7;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx - 3, sy - 3, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 4, sy - 3, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#222';
    if (blink) {
      ctx.fillRect(sx - 4, sy - 4, 6, 2);
      ctx.fillRect(sx + 2, sy - 4, 6, 2);
    } else {
      ctx.beginPath(); ctx.arc(sx - 2, sy - 3, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sx + 5, sy - 3, 1.6, 0, Math.PI*2); ctx.fill();
    }
    // HP bar
    if (e.hp < e.maxHp) {
      const bw = e.size * 2.2;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(sx - bw/2, sy - e.size - 7, bw, 4);
      ctx.fillStyle = e.isBoss ? '#FF4444' : '#4CAF50';
      ctx.fillRect(sx - bw/2, sy - e.size - 7, Math.max(1, bw * (e.hp/e.maxHp)), 4);
    }
    // Boss crown
    if (e.isBoss) {
      ctx.font = '13px serif';
      ctx.textAlign = 'center';
      ctx.fillText('👑', sx, sy - e.size - 10);
    }
  }
}

// ========== PROJECTILES ==========
function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (p.target && p.target.hp > 0) {
      p.tx = p.target.x; p.ty = p.target.y;
    }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 10 || !p.target || p.target.hp <= 0) {
      if (p.target && p.target.hp > 0) {
        p.target.hp -= p.damage;
        if (p.slow > 0) { p.target.slowTimer = p.slowDuration; }
      }
      if (p.aoe > 0) {
        for (const e of enemies) {
          if (e === p.target) continue;
          if (Math.hypot(e.x - p.tx, e.y - p.ty) < p.aoe) {
            e.hp -= Math.floor(p.damage * 0.55);
          }
        }
        spawnParticles(p.tx, p.ty, '#FF5500', 14);
      } else {
        spawnParticles(p.tx, p.ty, p.type === 'ice' ? '#66CCFF' : '#FFD700', 5);
      }
      projectiles.splice(i, 1);
      continue;
    }
    const vx = (dx / dist) * p.speed * dt * 60;
    const vy = (dy / dist) * p.speed * dt * 60;
    p.x += vx; p.y += vy;
    p.trail.push({x: p.x, y: p.y});
    if (p.trail.length > 8) p.trail.shift();
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    for (let i = 0; i < p.trail.length; i++) {
      const a = i / p.trail.length * 0.35;
      ctx.beginPath();
      ctx.arc(p.trail[i].x, p.trail[i].y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = p.type === 'arrow' ? `rgba(100,255,100,${a})` :
                      p.type === 'ice' ? `rgba(100,200,255,${a})` :
                      `rgba(255,150,50,${a})`;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.type === 'cannon' ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = p.type === 'arrow' ? '#A5D6A7' : p.type === 'ice' ? '#81D4FA' : '#FF8A65';
    ctx.fill();
  }
}

// ========== PARTICLES ==========
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.8 + Math.random() * 3.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.4 + Math.random() * 0.5,
      maxLife: 0.4 + Math.random() * 0.5,
      size: 1.5 + Math.random() * 4,
      color: color
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.vy += 0.06 * dt * 60;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ========== DRAWING ==========
function drawGround() {
  // Grass tiles
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const isLight = (r + c) % 2 === 0;
      ctx.fillStyle = isLight ? '#7CB342' : '#689F38';
      ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
    }
  }
  // Subtle grass texture
  ctx.fillStyle = 'rgba(139,195,74,0.25)';
  for (let i = 0; i < 60; i++) {
    const gx = Math.random() * W, gy = Math.random() * H;
    if (!isOnPath(gx, gy, TILE * 0.9)) {
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx - 2, gy - 5 - Math.random()*3);
      ctx.lineTo(gx + 2, gy - 5 - Math.random()*3);
      ctx.fill();
    }
  }
  // Dirt path – draw thick rounded segments between adjacent path tiles
  ctx.lineWidth = TILE * 0.82;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // Shadow beneath path
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.moveTo(pathTiles[0].c * TILE + TILE/2 + 2, pathTiles[0].r * TILE + TILE/2 + 2);
  for (let i = 1; i < pathTiles.length; i++) ctx.lineTo(pathTiles[i].c * TILE + TILE/2 + 2, pathTiles[i].r * TILE + TILE/2 + 2);
  ctx.stroke();
  // Main dirt
  ctx.strokeStyle = '#C19A6B';
  ctx.beginPath();
  ctx.moveTo(pathTiles[0].c * TILE + TILE/2, pathTiles[0].r * TILE + TILE/2);
  for (let i = 1; i < pathTiles.length; i++) ctx.lineTo(pathTiles[i].c * TILE + TILE/2, pathTiles[i].r * TILE + TILE/2);
  ctx.stroke();
  // Lighter centre
  ctx.lineWidth = TILE * 0.48;
  ctx.strokeStyle = '#D2B48C';
  ctx.beginPath();
  ctx.moveTo(pathTiles[0].c * TILE + TILE/2, pathTiles[0].r * TILE + TILE/2);
  for (let i = 1; i < pathTiles.length; i++) ctx.lineTo(pathTiles[i].c * TILE + TILE/2, pathTiles[i].r * TILE + TILE/2);
  ctx.stroke();
  // Start marker (left)
  const sx = pathTiles[0].c * TILE + TILE/2, sy = pathTiles[0].r * TILE + TILE/2;
  ctx.beginPath(); ctx.arc(sx, sy, 15, 0, Math.PI*2);
  ctx.fillStyle = '#4CAF50'; ctx.fill();
  ctx.strokeStyle = '#2E7D32'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('▶', sx, sy);
  // End marker (right)
  const ex = pathTiles[pathTiles.length-1].c * TILE + TILE/2, ey = pathTiles[pathTiles.length-1].r * TILE + TILE/2;
  ctx.beginPath(); ctx.arc(ex, ey, 17, 0, Math.PI*2);
  ctx.fillStyle = '#F44336'; ctx.fill();
  ctx.strokeStyle = '#C62828'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('❤×' + hp, ex, ey);
}

function drawHoveredTile() {
  if (!hoveredTile || !selectedTowerType || (gameState !== 'playing' && gameState !== 'waveActive')) return;
  const {col, row} = hoveredTile;
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
  const x = col * TILE, y = row * TILE;
  const canPlace = !isOnPath(x + TILE/2, y + TILE/2) &&
                   !towers.find(t => t.col === col && t.row === row);
  ctx.fillStyle = canPlace ? 'rgba(76,175,80,0.30)' : 'rgba(244,67,54,0.30)';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = canPlace ? '#4CAF50' : '#F44336';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
}

// ========== HUD ==========
function updateHUD() {
  document.getElementById('hudWave').textContent = wave + '/' + maxWaves;
  document.getElementById('hudHP').textContent = hp;
  document.getElementById('hudGold').textContent = gold;
  const statusEl = document.getElementById('hudStatus');
  if (gameState === 'playing') {
    if (enemies.length === 0 && spawnCount >= spawnTotal && wave < maxWaves) {
      statusEl.textContent = '👆 点击此处开始下一波';
      statusEl.style.color = '#FFD700';
    } else if (enemies.length > 0) {
      statusEl.textContent = '⚔ 战斗进行中...';
      statusEl.style.color = '#aaffaa';
    }
  } else {
    statusEl.textContent = '';
  }
}

function buildTowerBar() {
  const bar = document.getElementById('towerBar');
  bar.innerHTML = '';
  for (const [key, t] of Object.entries(TOWER_TYPES)) {
    const btn = document.createElement('div');
    btn.className = 'tower-btn' + (selectedTowerType === key ? ' selected' : '');
    const afford = gold >= t.cost;
    btn.innerHTML = '<span class="icon">' + t.icon + '</span><span class="name">' + t.name + '</span><span class="cost" style="color:' + (afford ? '#FFD700' : '#FF6666') + '">💰' + t.cost + '</span>';
    btn.onclick = function(k) {
      return function() {
        ensureAudio();
        if (selectedTowerType === k) { selectedTowerType = null; }
        else { selectedTowerType = k; selectedTower = null; }
        buildTowerBar();
      };
    }(key);
    if (!afford) btn.style.opacity = '0.5';
    bar.appendChild(btn);
  }
  if (selectedTower) {
    // Upgrade btn
    const upBtn = document.createElement('div');
    upBtn.className = 'tower-btn';
    const ucost = selectedTower.getUpgradeCost();
    const canUp = selectedTower.canUpgrade() && gold >= ucost;
    upBtn.innerHTML = '<span class="icon">⬆️</span><span class="name">升级 Lv' + selectedTower.level + '→' + (selectedTower.level+1) + '</span><span class="cost" style="color:' + (canUp ? '#FFD700' : '#FF6666') + '">💰' + ucost + '</span>';
    upBtn.onclick = function() {
      if (selectedTower && selectedTower.upgrade()) { buildTowerBar(); updateHUD(); }
    };
    if (!canUp) upBtn.style.opacity = '0.5';
    bar.appendChild(upBtn);
    // Sell btn
    const sellBtn = document.createElement('div');
    sellBtn.className = 'tower-btn';
    sellBtn.innerHTML = '<span class="icon">💰</span><span class="name">出售</span><span class="cost">+' + selectedTower.getSellValue() + '</span>';
    sellBtn.onclick = function() {
      gold += selectedTower.getSellValue();
      towers = towers.filter(function(tw) { return tw !== selectedTower; });
      selectedTower = null;
      playSellSound();
      buildTowerBar(); updateHUD();
    };
    bar.appendChild(sellBtn);
  }
}

// ========== WAVE SYSTEM ==========
function startWave() {
  if (wave >= maxWaves || gameState === 'waveActive') return;
  wave++;
  const isBossWave = (wave === 5 || wave === 10);
  if (isBossWave) {
    showAnnouncement(wave === 10 ? '⚠️ 最终BOSS来袭！⚠️' : '⚠️ BOSS 出现！⚠️', 'boss');
    playBossSound();
  } else {
    showAnnouncement('第 ' + wave + ' 波', 'wave');
  }
  spawnCount = 0;
  const baseCount = 5 + wave * 3;
  spawnTotal = isBossWave ? Math.floor(baseCount * 0.7) : baseCount;
  spawnTimer = 1.0;
  gameState = 'waveActive';
  updateHUD();
}

function doSpawn(dt) {
  if (spawnCount >= spawnTotal) return;
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const isBossWave = (wave === 5 || wave === 10);
    if (isBossWave && spawnCount === Math.floor(spawnTotal / 2)) {
      spawnEnemy(wave, true);
    } else {
      spawnEnemy(wave, false);
    }
    spawnCount++;
    spawnTimer = isBossWave ? 1.0 : Math.max(0.25, 0.7 - wave * 0.04);
  }
}

function showAnnouncement(text, type) {
  const div = document.createElement('div');
  div.className = type === 'boss' ? 'boss-warning' : 'wave-announce';
  div.textContent = text;
  document.getElementById('gameContainer').appendChild(div);
  setTimeout(function() { div.remove(); }, type === 'boss' ? 2400 : 1800);
}

// ========== GAME LOOP ==========
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  ctx.clearRect(0, 0, W, H);
  drawGround();
  drawHoveredTile();
  if (gameState === 'waveActive') {
    doSpawn(dt);
    updateEnemies(dt);
    // Check wave end
    if (spawnCount >= spawnTotal && enemies.length === 0) {
      if (wave >= maxWaves) {
        gameOver(true);
      } else {
        gameState = 'playing';
        updateHUD();
      }
    }
  }
  if (gameState === 'playing' || gameState === 'waveActive') {
    for (let i = 0; i < towers.length; i++) towers[i].update(dt);
  }
  updateParticles(dt);
  // Draw order: projectiles -> enemies -> towers -> particles
  drawProjectiles();
  drawEnemies();
  for (let i = 0; i < towers.length; i++) towers[i].draw();
  drawParticles();
  requestAnimationFrame(gameLoop);
}

// ========== INPUT ==========
function onCanvasClick(e) {
  if (gameState !== 'playing' && gameState !== 'waveActive') return;
  ensureAudio();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  const col = Math.floor(mx / TILE);
  const row = Math.floor(my / TILE);
  // Check existing tower click
  for (let i = 0; i < towers.length; i++) {
    const t = towers[i];
    if (Math.hypot(mx - t.x, my - t.y) < 26) {
      selectedTower = t;
      selectedTowerType = null;
      buildTowerBar();
      return;
    }
  }
  selectedTower = null;
  // Place tower
  if (selectedTowerType) {
    const t = TOWER_TYPES[selectedTowerType];
    if (gold < t.cost) { selectedTowerType = null; buildTowerBar(); return; }
    if (isOnPath(col * TILE + TILE/2, row * TILE + TILE/2)) return;
    if (towers.find(function(tw) { return tw.col === col && tw.row === row; })) return;
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    gold -= t.cost;
    const tower = new Tower(selectedTowerType, col, row);
    towers.push(tower);
    playBuildSound();
    selectedTowerType = null;
    buildTowerBar();
    updateHUD();
  }
}

function onCanvasMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);
  hoveredTile = { col: Math.floor(mx / TILE), row: Math.floor(my / TILE) };
}

// ========== GAME STATE ==========
function startGame() {
  ensureAudio();
  document.getElementById('startBtn').style.display = 'none';
  gameState = 'playing';
  gold = 200; hp = 10; wave = 0;
  towers = []; enemies = []; projectiles = []; particles = [];
  selectedTowerType = null; selectedTower = null;
  generatePath();
  buildTowerBar();
  updateHUD();
  // Auto-start wave 1 after short delay
  setTimeout(function() { startWave(); }, 600);
}

function gameOver(win) {
  gameState = win ? 'win' : 'gameOver';
  const go = document.getElementById('gameOver');
  go.classList.add('show');
  document.getElementById('goTitle').textContent = win ? '🎉 胜利！' : '💀 失败...';
}

// ========== INIT ==========
window.onload = function() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  canvas.width = W;
  canvas.height = H;
  const container = document.getElementById('gameContainer');
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  container.style.width = W + 'px';
  container.style.height = H + 'px';
  generatePath();
  canvas.addEventListener('click', onCanvasClick);
  canvas.addEventListener('mousemove', onCanvasMouseMove);
  document.getElementById('startBtn').addEventListener('click', startGame);
  // Click HUD to start next wave
  document.getElementById('hud').addEventListener('click', function(e) {
    if (gameState === 'playing' && wave < maxWaves && enemies.length === 0) {
      startWave();
    }
  });
  requestAnimationFrame(gameLoop);
};

// ========== COLOR HELPERS ==========
function lightenColor(hex, pct) {
  var num = parseInt(hex.slice(1), 16);
  var r = Math.min(255, (num >> 16) + pct);
  var g = Math.min(255, ((num >> 8) & 0xFF) + pct);
  var b = Math.min(255, (num & 0xFF) + pct);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function darkenColor(hex, pct) {
  var num = parseInt(hex.slice(1), 16);
  var r = Math.max(0, (num >> 16) - pct);
  var g = Math.max(0, ((num >> 8) & 0xFF) - pct);
  var b = Math.max(0, (num & 0xFF) - pct);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var a = s * Math.min(l, 1 - l);
  var f = function(n) {
    var k = (n + h / 30) % 12;
    var color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}
